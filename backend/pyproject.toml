[project]
name = "mc-stock-sim-core"
version = "0.1.0"
description = "Monte Carlo (GBM) stock price simulator - core library, CLI and API"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26", "pandas>=2.1", "yfinance>=0.2.40", "fastapi>=0.115", "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["rich>=13.0", "matplotlib>=3.8", "pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
