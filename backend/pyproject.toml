[project]
name = "mc-stock-sim-core"
version = "0.1.0"
description = "Monte Carlo (GBM) stock price simulator - core library"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "yfinance>=0.2.40"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
